<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRJ200 Manual</title>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta name="theme-color" content="#0b1220">

  <link rel="stylesheet" href="css/styles.css?v=20260210">
  <link rel="manifest" href="manifest.json?v=20260210">
</head>
<body>
  <div id="top-bar">
    <button id="menu-btn" aria-label="Toggle navigation">☰</button>
    <span>CRJ200 Manual Navigator</span>
  </div>

  <div id="menu-overlay" aria-hidden="true"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <p class="eyebrow">Technical Library</p>
      <h1>CRJ200 Manual Navigator</h1>
      <p class="subtext">Find maintenance procedures, parts references, and system data quickly.</p>
    </div>

    <div id="doc-selector-container" class="panel">
      <label for="doc-selector">Manual</label>
      <select id="doc-selector">
        <option value="AMM">AMM - Aircraft Maintenance Manual</option>
        <option value="AIPC">AIPC - Illustrated Parts Catalog</option>
        <option value="CMM">CMM</option>
        <option value="ESPM">ESPM</option>
        <option value="FIM">FIM</option>
        <option value="MPM">MPM</option>
        <option value="MTCM">MTCM</option>
        <option value="NDT">NDT</option>
        <option value="PPBM">PPBM</option>
        <option value="SRM">SRM</option>
        <option value="WM">WM</option>
      </select>
    </div>

    <div id="search-container" class="panel">
      <label for="search">Search</label>
      <div class="search-row">
        <input type="text" id="search" placeholder="Search by ATA path, system, or title..." autocomplete="off">
        <button id="reset-btn">Reset</button>
      </div>
    </div>

    <div id="tree-container" class="panel"></div>

    <div id="results-container" class="panel">
      <h3>Search Results</h3>
      <ul id="results-list"></ul>
    </div>
  </aside>

  <main id="viewer">
    <div class="viewer-empty-state">
      <h2>Select a document</h2>
      <p>Choose a manual on the left, then pick a document to open it in the viewer.</p>
    </div>
  </main>

  <script src="js/data.js?v=20260210"></script>
  <script src="js/tree.js?v=20260210"></script>
  <script src="js/viewer.js?v=20260210"></script>
  <script src="js/search.js?v=20260210"></script>
  <script src="js/app.js?v=20260210"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) reg.unregister();
      });
    }
  </script>
</body>
</html>
