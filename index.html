<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRJ200 Manual</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#1e1e2f">
  <link rel="stylesheet" href="css/styles.css?v=20261006">
  <link rel="manifest" href="manifest.json?v=20261006">
</head>
<body>
  <div id="sidebar">
    <div id="doc-selector-container">
      <select id="doc-selector">
        <option value="AMM">AMM - Aircraft Maintenance Manual</option>
        <option value="AIPC">AIPC - Illustrated Parts Catalog</option>
        <option value="CMM">CMM - Component Maintenance Manual</option>
        <option value="ESPM">ESPM - Electrical Standard Practices Manual</option>
        <option value="FIM">FIM - Fault Isolation Manual</option>
        <option value="MPM">MPM - Maintenance Planning Manual</option>
        <option value="MTCM">MTCM - Maintenance Task Card Manual</option>
        <option value="NDT">NDT - Non Destructive Testing</option>
        <option value="PPBM">PPBM - Powerplant Buildup Manual</option>
        <option value="SRM">SRM - Structural Reapir Manual</option>
        <option value="WM">WM - Wiring Manual</option>
      </select>
    </div>

    <div id="search-container">
      <input type="text" id="search" placeholder="Search documents and PDF text...">
      <button id="reset-btn">Reset</button>
    </div>

    <div id="pdf-upload-container">
      <label for="pdf-file" id="pdf-file-label">Open any PDF</label>
      <input type="file" id="pdf-file" accept="application/pdf,.pdf">
      <div id="pdf-search-status" role="status" aria-live="polite">PDF text search ready</div>
    </div>

    <div id="tree-container"></div>

    <div id="results-container">
      <h3>Search Results</h3>
      <ul id="results-list"></ul>
    </div>
  </div>

  <div id="top-bar">
    <button id="menu-btn">☰</button>
    <span>CRJ200 Manual</span>
  </div>

  <div id="menu-overlay"></div>
  <div id="viewer"><h2>Select a document</h2></div>

  <script src="js/data.js?v=20261006"></script>
  <script src="js/tree.js?v=20261006"></script>
  <script src="js/viewer.js?v=20261006"></script>
  <script src="js/pdf-search.js?v=20261006"></script>
  <script src="js/search.js?v=20261006"></script>
  <script src="js/app.js?v=20261006"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) reg.unregister();
      });
    }
  </script>
</body>
</html>
