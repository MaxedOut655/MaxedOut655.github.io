<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRJ200 Manual</title>

  <!-- Prevent caching for Safari & other browsers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Theme color for PWA -->
  <meta name="theme-color" content="#0f172a">

  <!-- Styles with cache-busting -->
  <link rel="stylesheet" href="css/styles.css?v=20260210">

  <!-- Manifest for PWA -->
  <link rel="manifest" href="manifest.json?v=20260210">
</head>
<body>
  <!-- Top bar for mobile -->
  <header id="top-bar">
    <button id="menu-btn" aria-label="Open navigation menu">☰</button>
    <span>CRJ200 Manual</span>
  </header>

  <!-- Overlay behind menu -->
  <div id="menu-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="panel-header">
      <h1>CRJ200 Manual Viewer</h1>
      <p>Browse maintenance manuals, quickly search, and open documents in one place.</p>
    </div>

    <div id="doc-selector-container" class="panel-card">
      <label for="doc-selector">Manual Set</label>
      <select id="doc-selector">
        <option value="AMM">AMM - Aircraft Maintenance Manual</option>
        <option value="AIPC">AIPC - Illustrated Parts Catalog</option>
        <option value="CMM">CMM</option>
        <option value="ESPM">ESPM</option>
        <option value="FIM">FIM</option>
        <option value="MPM">MPM</option>
        <option value="MTCM">MTCM</option>
        <option value="NDT">NDT</option>
        <option value="PPBM">PPBM</option>
        <option value="SRM">SRM</option>
        <option value="WM">WM</option>
      </select>
    </div>

    <div id="search-container" class="panel-card">
      <label for="search">Search</label>
      <div class="search-row">
        <input type="text" id="search" placeholder="Search documents..." autocomplete="off">
        <button id="reset-btn" type="button" title="Single click clears search. Double-click/long-press resets view.">Reset</button>
      </div>
    </div>

    <div id="tree-container" class="panel-card"></div>

    <div id="results-container" class="panel-card">
      <h3>Search Results</h3>
      <ul id="results-list"></ul>
    </div>
  </aside>

  <!-- Viewer -->
  <main id="viewer">
    <h2>Select a document</h2>
    <p class="viewer-help">Use the left panel to choose a manual and open a document.</p>
  </main>

  <!-- Scripts with cache-busting -->
  <script src="js/data.js?v=20260210"></script>
  <script src="js/tree.js?v=20260210"></script>
  <script src="js/viewer.js?v=20260210"></script>
  <script src="js/search.js?v=20260210"></script>
  <script src="js/app.js?v=20260210"></script>

  <!-- Temporary: Clear old service workers to avoid cached files -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let reg of registrations) reg.unregister();
      });
    }
  </script>
</body>
</html>
